<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tenaiten Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Поддержка тем Telegram */
    :root {
      --bg: var(--tg-theme-bg-color, #0d1117);
      --text: var(--tg-theme-text-color, #e6edf3);
      --hint: var(--tg-theme-hint-color, #8b949e);
      --btn: var(--tg-theme-button-color, #238636);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --card: var(--tg-theme-secondary-bg-color, #161b22);
      --border: rgba(255,255,255,0.1);
      --danger: #da3633;
      --green: #3fb950;
      --yellow: #d29922;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px; /* Ограничение для ПК */
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    /* На ПК делаем 2 колонки */
    @media (min-width: 768px) {
      .container {
        grid-template-columns: 1fr 1fr;
      }
    }

    h1 {
      font-size: 20px;
      margin: 0 0 16px 0;
      text-align: center;
      color: var(--text);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card h2 {
      font-size: 16px;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--hint);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: rgba(139, 148, 158, 0.2);
      color: var(--hint);
    }
    .status-badge.running {
      background: rgba(63, 185, 80, 0.2);
      color: var(--green);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--hint);
    }
    .info-row span:last-child {
      color: var(--text);
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: var(--btn);
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      color: var(--btn-text);
      background: var(--btn);
      transition: opacity 0.2s;
    }
    button:active { opacity: 0.8; }
    button.stop { background: var(--danger); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .loading {
      text-align: center;
      padding: 20px;
      color: var(--hint);
    }
  </style>
</head>
<body>
  <h1>⛏️ Tenaiten Checker</h1>

  <div class="container" id="container">
    <div class="loading">Загрузка данных...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем на весь экран
    tg.setHeaderColor('secondary_bg_color'); // Красим шапку

    const container = document.getElementById('container');

    // Рендер одного профиля
    function renderProfile(profileId, status) {
      const isRunning = status.running;
      const nick = status.targetNick || '—';
      const current = status.currentIndex + 1;
      const total = status.total || 0;
      const pct = total ? Math.round((current / total) * 100) : 0;

      return `
        <div class="card">
          <h2>Профиль ${profileId}</h2>
          
          <div class="status-row">
            <span>Статус</span>
            <span class="status-badge ${isRunning ? 'running' : ''}">
              ${isRunning ? 'В работе' : 'Остановлен'}
            </span>
          </div>

          <div class="info-row">
            <span>Текущий ник</span>
            <span>${nick}</span>
          </div>
          <div class="info-row">
            <span>Прогресс</span>
            <span>${current} / ${total}</span>
          </div>

          <input type="text" id="nick-${profileId}" placeholder="Введите ник для проверки" value="${nick !== '—' ? nick : ''}">

          <div class="btn-row">
            <button onclick="startProfile(${profileId})" ${isRunning ? 'disabled' : ''}>▶ Старт</button>
            <button class="stop" onclick="stopProfile(${profileId})" ${!isRunning ? 'disabled' : ''}>■ Стоп</button>
          </div>
        </div>
      `;
    }

    // Обновление интерфейса
    function updateUI(data) {
      container.innerHTML = 
        renderProfile(1, data[1] || { running: false }) + 
        renderProfile(2, data[2] || { running: false });
    }

    // Отправка действий боту
    function sendAction(action, profileId, nick) {
      const data = { action, profileId, nick };
      tg.sendData(JSON.stringify(data));
      tg.close(); // Закрываем WebApp после отправки
    }

    function startProfile(id) {
      const nick = document.getElementById(`nick-${id}`).value.trim();
      if (!nick) {
        tg.showAlert("Введите ник!");
        return;
      }
      sendAction('start', id, nick);
    }

    function stopProfile(id) {
      sendAction('stop', id);
    }

    // (Опционально) Можно запросить статус при загрузке, если у тебя есть API
    // Пока просто заглушка
    const initialData = {
      1: { running: false, targetNick: null, currentIndex: 0, total: 0 },
      2: { running: false, targetNick: null, currentIndex: 0, total: 0 }
    };
    updateUI(initialData);

    // Если бот пришлёт данные, можно обновить через tg.onEvent('themeChanged', ...)
  </script>
</body>
</html>
