<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tenaiten Checker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0d1117);
      --bg-alt: var(--tg-theme-secondary-bg-color, #161b22);
      --bg-input: #21262d;
      --border: #30363d;
      --text: var(--tg-theme-text-color, #e6edf3);
      --text-dim: var(--tg-theme-hint-color, #8b949e);
      --accent: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --yellow: #d29922;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }

    .app { display: flex; flex-direction: column; min-height: 100vh; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
    }

    header h1 { margin: 0; font-size: 18px; font-weight: 600; }

    .layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      flex: 1;
    }

    @media (min-width: 768px) {
      .layout { flex-direction: row; }
      .panel { flex: 1; }
      .panel.settings { max-width: 400px; }
    }

    .panel {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      overflow-y: auto;
      max-height: 85vh;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--text-dim);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 12px;
      color: var(--text-dim);
    }

    input {
      width: 100%;
      margin-top: 4px;
      padding: 8px 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

    .row { display: flex; gap: 8px; margin: 14px 0; }

    .btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-input);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn.primary { background: #238636; border-color: #2ea043; }
    .btn.danger { background: #da3633; border-color: #f85149; }
    .btn.active { background: var(--bg-alt); color: var(--accent); border-color: var(--accent); }

    .progress-wrap { margin-top: 12px; }
    .progress-bar {
      height: 8px;
      background: var(--bg-input);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar > div {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #238636, #3fb950);
    }
    .progress-text {
      font-size: 11px;
      color: var(--text-dim);
      text-align: right;
      margin-top: 4px;
    }

    .current {
      margin-top: 10px;
      padding: 8px 12px;
      background: var(--bg-input);
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.8;
    }
    .current .label { color: var(--text-dim); margin-right: 8px; }

    /* Вкладки */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--bg-alt);
      overflow-x: auto;
    }
    .tab {
      padding: 12px 18px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { display: none; padding: 16px; }
    .tab-content.active { display: block; }

    .results-list { list-style: none; margin: 0; padding: 0; }
    .results-list li {
      display: flex;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg-input);
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 13px;
      border-left: 3px solid var(--green);
    }
    .results-list li .team {
      color: var(--green);
      font-family: monospace;
    }

    .queue-item {
      background: var(--bg-input);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .queue-top { display: flex; gap: 8px; margin-bottom: 4px; }
    .queue-top input { margin-top: 0; padding: 6px 8px; }
    .queue-top .btn.small.danger { padding: 0 12px; font-size: 18px; }
    .queue-info { font-size: 11px; color: var(--text-dim); margin-left: 2px; }

    .tab-selector {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .tab-selector select {
      background: var(--bg-input);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>⛏️ Tenaiten Checker</h1>
    </header>

    <div class="layout">
      <!-- ЛЕВАЯ ПАНЕЛЬ (УПРАВЛЕНИЕ) -->
      <aside class="panel settings">
        <div class="row" style="margin-top: 0; margin-bottom: 16px;">
          <button class="btn active" id="btnTab1" onclick="switchTab(1)">Профиль 1</button>
          <button class="btn" id="btnTab2" onclick="switchTab(2)">Профиль 2</button>
        </div>

        <!-- Профиль 1 -->
        <div id="profile1">
          <label>Проверяемый ник
            <input id="nick1" type="text" placeholder="Например: Notch" />
          </label>
          <div class="row">
            <button class="btn primary" onclick="startProfile(1)">▶ Старт</button>
            <button class="btn danger" onclick="stopProfile(1)">■ Стоп</button>
          </div>
          <div class="progress-wrap">
            <div class="progress-bar"><div id="fill1"></div></div>
            <div class="progress-text" id="text1">0 / 0</div>
          </div>
          <div class="current">
            <div><span class="label">Вариант:</span> <span id="curr1">—</span></div>
            <div><span class="label">Прогресс:</span> <span id="prog1">— / —</span></div>
          </div>

          <hr /><h2>Доп. ники</h2>
          <div id="queue1" class="queue-container"></div>
          <button class="btn small" style="width:100%; margin-bottom:16px;" onclick="addQueueItem(1)">+ Добавить ник</button>

          <hr /><h2>Настройки</h2>
          <label>Сервер <input id="host1" type="text" value="mc.masedworld.net" /></label>
          <label>Версия <input id="version1" type="text" value="1.20.1" /></label>
          <label>Пароль <input id="password1" type="text" placeholder="Пусто = 123123" /></label>
          <label>Команда после входа <input id="postCommand1" type="text" placeholder="/sw" /></label>
        </div>

        <!-- Профиль 2 -->
        <div id="profile2" style="display: none;">
          <label>Проверяемый ник
            <input id="nick2" type="text" placeholder="Например: Notch" />
          </label>
          <div class="row">
            <button class="btn primary" onclick="startProfile(2)">▶ Старт</button>
            <button class="btn danger" onclick="stopProfile(2)">■ Стоп</button>
          </div>
          <div class="progress-wrap">
            <div class="progress-bar"><div id="fill2"></div></div>
            <div class="progress-text" id="text2">0 / 0</div>
          </div>
          <div class="current">
            <div><span class="label">Вариант:</span> <span id="curr2">—</span></div>
            <div><span class="label">Прогресс:</span> <span id="prog2">— / —</span></div>
          </div>

          <hr /><h2>Доп. ники</h2>
          <div id="queue2" class="queue-container"></div>
          <button class="btn small" style="width:100%; margin-bottom:16px;" onclick="addQueueItem(2)">+ Добавить ник</button>

          <hr /><h2>Настройки</h2>
          <label>Сервер <input id="host2" type="text" value="mc.masedworld.net" /></label>
          <label>Версия <input id="version2" type="text" value="1.20.1" /></label>
          <label>Пароль <input id="password2" type="text" placeholder="Пусто = 123123" /></label>
          <label>Команда после входа <input id="postCommand2" type="text" placeholder="/sw" /></label>
        </div>
      </aside>

      <!-- ПРАВАЯ ПАНЕЛЬ (РЕЗУЛЬТАТЫ) -->
      <main class="panel results" style="padding: 0; overflow: hidden;">
        <div class="tabs">
          <button class="tab active" onclick="switchSubTab('results')">📊 Результаты</button>
          <button class="tab" onclick="switchSubTab('high')">⬆️ Топ высоких</button>
          <button class="tab" onclick="switchSubTab('low')">⬇️ Топ низких</button>
          <button class="tab" onclick="switchSubTab('log')">📜 Лог</button>
        </div>

        <div id="tab-results" class="tab-content active">
          <div class="tab-selector">
            <label>Просмотр:</label>
            <select id="viewProfileResults" onchange="updateResultsView()">
              <option value="1">Профиль 1</option>
              <option value="2">Профиль 2</option>
            </select>
          </div>
          <div class="empty" id="resultsEmpty">Нет результатов.</div>
          <ul class="results-list" id="resultsList"></ul>
        </div>

        <div id="tab-log" class="tab-content">
          <pre id="log" style="font-family: monospace; font-size: 12px; white-space: pre-wrap;"></pre>
        </div>
      </main>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor('secondary_bg_color');
    tg.setBackgroundColor('secondary_bg_color');

    let currentProfile = 1;
    let currentViewProfile = '1';

    function switchTab(pid) {
      currentProfile = pid;
      document.getElementById('profile1').style.display = pid === 1 ? 'block' : 'none';
      document.getElementById('profile2').style.display = pid === 2 ? 'block' : 'none';
      document.getElementById('btnTab1').classList.toggle('active', pid === 1);
      document.getElementById('btnTab2').classList.toggle('active', pid === 2);
    }

    function switchSubTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    function addQueueItem(pid) {
      const container = document.getElementById(`queue${pid}`);
      const item = document.createElement('div');
      item.className = 'queue-item';
      
      const topRow = document.createElement('div');
      topRow.className = 'queue-top';
      
      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = 'Доп. ник';
      
      const delBtn = document.createElement('button');
      delBtn.className = 'btn small danger';
      delBtn.textContent = '−';
      delBtn.onclick = () => item.remove();
      
      topRow.appendChild(input);
      topRow.appendChild(delBtn);
      item.appendChild(topRow);
      container.appendChild(item);
    }

    // Отправка команды в бота
    function sendAction(action, profileId, nick) {
      // Собираем настройки профиля
      const host = document.getElementById(`host${profileId}`).value.trim();
      const version = document.getElementById(`version${profileId}`).value.trim();
      const password = document.getElementById(`password${profileId}`).value;
      const postCommand = document.getElementById(`postCommand${profileId}`).value.trim();
      
      const data = { action, profileId, nick, host, version, password, postCommand };
      tg.sendData(JSON.stringify(data));
      tg.close();
    }

    function startProfile(id) {
      const nick = document.getElementById(`nick${id}`).value.trim();
      if (!nick) {
        tg.showAlert("Введите ник!");
        return;
      }
      sendAction('start', id, nick);
    }

    function stopProfile(id) {
      sendAction('stop', id);
    }

    function updateResultsView() {
      currentViewProfile = document.getElementById('viewProfileResults').value;
      // В реальном времени обновлять результаты из программы без веб-сервера нельзя,
      // поэтому мы просто показываем заглушку или оставляем пустым.
      // Бот может прислать данные при открытии, но для этого нужен полноценный бэкенд.
    }
  </script>
</body>
</html>
